name: VPN Gate Node Check

on:
  # 定时检测: 默认每 30 分钟一次。改成每 60 分钟: cron: "0 * * * *"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: "https://check.helei.kdns.fr/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://jerylihub.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
名称：VPN Gate 节点检查：# 定时检测：默认每 30 分钟一次。每 60 分钟改成： cron: "0 * * * *" 日程安排：- cron: "*/30 * * * *"workflow_dispatch: 权限: 内容: 读取页面: 写入 id-token: 写入并发: 组: gateway-check 取消进行中: false 作业: 检查: 运行: ubuntu-最新超时分钟: 30 步骤： - 名称：结帐使用：actions/checkout@v4 - 名称：设置 Python 使用：actions/setup-python@v5 与：python-version：“3.11” - 名称：安装依赖项 运行：pip install -r requests.txt - 名称：获取 VPN Gate 节点 + 通过 Cloudflare Worker 检查 + 构建页面 运行：python vpngate.py env: # 已部署的检测 Worker（不要初始化：检测统一走这里） CHECK_WORKER: "https://check.helei.kdns.fr/check?sstp=vpn:vpn@" CHECK_CONCURRENCY: "32" CHECK_TIMEOUT: "90" - name: 确保 GitHub Pages 已启用（一次性自动设置） run: | code=$(curl -s -o /dev/null -w '%{http_code}' \ -H "Authorization: Bearer $GITHUB_TOKEN" \ "https://api.github.com/repos/$GITHUB_REPOSITORY/pages") echo "Pages API 状态: $code" if [ "$code" = "404" ];然后 echo "首次运行：启用 GitHub Pages（source = GitHub Actions，目录 /public）" curl -sS -X PUT \ -H "Authorization: Bearer $GITHUB_TOKEN" \ -H "Content-Type: application/json" \ -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \ "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" echo sleep 10 fi env: GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} - name: 配置页面 uses: actions/configure-pages@v5 - name: 上传页面工件 uses: actions/upload-pages-artifact@v3 with: path: 'public' - name: 部署到 GitHub Pages id: deployment uses: actions/deploy-pages@v4 - name: 显示站点 URL 运行：'echo "站点：https://jerylihub.github.io/gate/（部署结果：${{ steps.deployment.outcome }}）"'
